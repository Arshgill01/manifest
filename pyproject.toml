[project]
name = "manifest-harness"
version = "0.1.0"
description = "A coding-agent harness that grows itself: a local 4B model + teacher-grown, Warden-gated routines that run fully offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6",
  "openai>=1.50",
  "pytest>=8",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.scripts]
manifest = "warden.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks", "harness", "routines", "growth", "warden"]

[tool.pytest.ini_options]
# generated task packages carry their own test suites; never collect them from the repo root
norecursedirs = ["generated", "templates", "demo", ".manifest", "gui", "node_modules", ".venv", "skills"]
testpaths = ["tests"]
